# MacLagMonitor example configuration
# Copy this file to config.conf before running from a source checkout.
# The installer creates config.conf automatically and preserves it on upgrades.

# LaunchAgent identity used by install/control/uninstall scripts.
LAUNCHD_LABEL="com.maclagmonitor.agent"

# Routine sampling. Longer intervals reduce background work but can miss short events.
AC_INTERVAL_SECONDS=120
BATTERY_INTERVAL_SECONDS=240
LOW_POWER_INTERVAL_SECONDS=600
DISPLAY_OFF_INTERVAL_SECONDS=600
NETWORK_STATE_INTERVAL_SECONDS=1200

# External internet reachability checks. Set to 0 to disable completely.
INTERNET_CHECK_ENABLED=1
INTERNET_CHECK_PRIMARY_URL="https://captive.apple.com/hotspot-detect.html"
INTERNET_CHECK_SECONDARY_URL="https://cp.cloudflare.com/generate_204"
INTERNET_CONNECT_TIMEOUT_SECONDS=2
INTERNET_TOTAL_TIMEOUT_SECONDS=4

# Incident capture cost limits.
INCIDENT_INTERVAL_SECONDS=8
INCIDENT_DURATION_SECONDS=240
PRE_TRIGGER_MINUTES=30
SYSTEM_LOG_LOOKBACK_MINUTES=20
PROCESS_SAMPLE_SECONDS=2
PROCESS_SAMPLE_MAX_PER_INCIDENT=2
PROCESS_SAMPLE_COOLDOWN_SECONDS=60
PROCESS_SAMPLE_MAX_KB=256
SYSTEM_LOG_CAPTURE_TIMEOUT_SECONDS=8
SYSTEM_LOG_TEMP_MAX_MB=8
SYSTEM_LOG_OUTPUT_MAX_MB=2
MACOS_RESOURCE_REPORT_MAX_FILES=3
REBOOT_POSTMORTEM_ROWS=40
DOMAIN_CORRELATION_MAX_INCIDENTS=10
DOMAIN_CORRELATION_MIN_REPEAT=2
DOMAIN_CORRELATION_TOP_RESULTS=5

# Trigger behavior.
CONSECUTIVE_TRIGGER_SAMPLES=2
PERFORMANCE_EPISODE_RECOVERY_SAMPLES=3
SAMPLE_STALL_TRIGGER_SECONDS=10

# Context thresholds. These add flags to summary.tsv but do not by themselves
# start an incident. Treat the values as conservative defaults, not universal
# thresholds for every Mac or workload.
MEMORY_FREE_PERCENT_THRESHOLD=15
COMPRESSOR_MB_THRESHOLD=12288
SAFARI_GROUP_MB_THRESHOLD=6144
WEBKIT_PROCESS_MB_THRESHOLD=1536
WINDOWSERVER_CPU_THRESHOLD=40
WEBKIT_CPU_SAMPLE_THRESHOLD=50

# Incident thresholds. These are intentionally stricter than context thresholds.
# Adjust only after observing false positives or missed incidents on your Mac.
INCIDENT_MEMORY_FREE_PERCENT_THRESHOLD=10
INCIDENT_COMPRESSOR_MB_THRESHOLD=14336
INCIDENT_SAFARI_GROUP_MB_THRESHOLD=14336
INCIDENT_WEBKIT_PROCESS_MB_THRESHOLD=8192
INCIDENT_WINDOWSERVER_CPU_THRESHOLD=70
INCIDENT_WEBKIT_CPU_THRESHOLD=80

# High-value specialized triggers.
REPORTCRASH_CPU_THRESHOLD=30
CORESYMBOLICATION_CPU_THRESHOLD=15
MEDIAANALYSISD_CPU_THRESHOLD=100
MOBILEASSETD_CPU_THRESHOLD=80
REPLAYD_CPU_THRESHOLD=40
SYSTEM_LOAD_PER_LOGICAL_CPU_THRESHOLD=2

# Storage. A full directory scan normally runs every 6 hours; an incident or
# low-disk event forces one immediately.
RETENTION_DAYS=7
TOTAL_SIZE_LIMIT_MB=200
SUMMARY_SIZE_LIMIT_MB=50
INCIDENTS_SIZE_LIMIT_MB=150
SINGLE_INCIDENT_SIZE_LIMIT_MB=20
MAX_INCIDENT_COUNT=10
MIN_FREE_DISK_MB=5120
STORAGE_MAINTENANCE_INTERVAL_SECONDS=21600
LAUNCHD_LOG_SIZE_LIMIT_MB=2

# Privacy and optional diagnostics.
# Safari domain capture may cause macOS to request Automation permission.
# Only hostnames are retained by this feature, not full URLs or page titles.
CAPTURE_SAFARI_DOMAINS=1
SAFARI_DIAGNOSTICS_ENABLED=1
SAFARI_FAULT_EXTRACT_MAX_KB=256
SAFARI_FAULT_MAX_REPORTS=2
LOCAL_NOTIFICATION_ENABLED=0

# Optional local integrations. Empty values disable them. These are intentionally
# generic so a public checkout does not encode the maintainer's installed apps.
# Regexes are matched against the process line returned by ps.
AUX_APP_1_PROCESS_REGEX=""
AUX_APP_2_PROCESS_REGEX=""
CONTENT_FILTER_PROCESS_REGEX=""
CONTENT_FILTER_LOG_DIR=""

# Self-monitoring.
SELF_MAX_SAMPLE_SECONDS=2
